name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/?select=*" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
